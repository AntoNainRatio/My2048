name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [tests]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb

      - name: Install depedencies
        run: bash install.sh

      - name: Run tests
        run: make check
